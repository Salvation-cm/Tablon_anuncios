{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>{% if categoria %}Editar Categoría{% else %}Nueva Categoría{% endif %}</h2>
        
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Nombre de la categoría:</label>
                <input type="text" name="nombre" class="form-control" value="{{ categoria.nombre if categoria else '' }}" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('categorias.index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
