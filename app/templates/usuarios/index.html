{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Lista de Usuarios</h2>
    <a href="{{ url_for('usuarios.crear') }}" class="btn btn-success">+ Nuevo Usuario</a>
</div>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.nombre }}</td>
            <td>{{ u.email }}</td>
            <td>
                <!-- Botón de Editar -->
                <a href="{{ url_for('usuarios.editar', id=u.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <!-- Botón de Eliminar -->
                <a href="{{ url_for('usuarios.eliminar', id=u.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que quieres eliminar a este usuario?')">Eliminar</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="text-center">No hay usuarios registrados.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
