{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Anuncios</h2>
    <a href="{{ url_for('anuncios.crear') }}" class="btn btn-success">+ Nuevo</a>
</div>
<div class="row">
    {% for a in anuncios %}
    <div class="col-md-6 mb-3">
        <div class="card p-3">
            <h5>{{ a.titulo }}</h5>
            <p>{{ a.contenido }}</p>
            <small>Autor: {{ a.autor.nombre }} | Categoría: {{ a.categoria.nombre }}</small>
            <div class="mt-2">
                <a href="{{ url_for('anuncios.editar', id=a.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{{ url_for('anuncios.eliminar', id=a.id) }}" class="btn btn-sm btn-danger">Eliminar</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
