{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>{% if anuncio %}Editar Anuncio{% else %}Nuevo Anuncio{% endif %}</h2>
        
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input type="text" name="titulo" class="form-control" value="{{ anuncio.titulo if anuncio else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contenido:</label>
                <textarea name="contenido" class="form-control" rows="4" required>{{ anuncio.contenido if anuncio else '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoría:</label>
                <select name="categoria_id" class="form-select" required>
                    <option value="">Seleccione una categoría...</option>
                    {% for c in categorias %}
                    <!-- Este if hace que si estamos editando, la categoría actual se quede seleccionada -->
                    <option value="{{ c.id }}" {% if anuncio and anuncio.categoria_id == c.id %}selected{% endif %}>
                        {{ c.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('anuncios.index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
